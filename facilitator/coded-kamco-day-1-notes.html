<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,rgba(47,116,214,.13),transparent 60%),var(--base);color:var(--w);font-family:var(--mf);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.wrap{height:100dvh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--crimson);box-shadow:0 0 10px var(--crimson)}
.brand b{color:var(--rose-lt);font-weight:800}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pos{font-family:var(--mono);font-size:13px;color:var(--w6)}
.pos b{color:var(--w);font-weight:700}
.jumpbtn{background:var(--w06);border:1px solid var(--w1);color:var(--w8);font-family:var(--mf);font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer}
.jumpbtn:active{background:var(--w1)}
.prail{height:3px;background:var(--w06);border-radius:3px;margin-top:11px;overflow:hidden;flex:none}
.prail .fill{height:100%;background:linear-gradient(90deg,var(--maroon),var(--crimson),var(--rose));border-radius:3px;transition:width .2s}

/* card */
.stage{flex:1;display:flex;min-height:0;position:relative}
.card{flex:1;display:flex;flex-direction:column;min-height:0;padding:22px 4px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-lt);background:rgba(47,116,214,.12);border:1px solid rgba(47,116,214,.3);padding:6px 11px;border-radius:20px;font-weight:700}
.kind{align-self:flex-start;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:4px 0}
.k-story{color:var(--rose)}.k-analogy{color:var(--amber)}.k-term,.k-phase{color:var(--w7)}.k-check,.k-demo{color:var(--green-lt)}.k-case{color:var(--amber)}.k-pause{color:var(--w5)}.k-open,.k-close{color:var(--rose)}
h1{font-size:clamp(27px,5.4vw,40px);font-weight:800;letter-spacing:-1px;line-height:1.08;margin:7px 0 4px}
.term-badge{display:inline-block;margin:10px 0 2px;font-family:var(--mono);font-weight:700;font-size:clamp(20px,4vw,28px);letter-spacing:1px;color:var(--w);background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--w2);border-left:3px solid var(--crimson);padding:9px 16px;border-radius:10px}
ul{list-style:none;margin:18px 0 6px}
li{position:relative;padding-left:26px;margin:0 0 15px;font-size:clamp(17px,3.2vw,21px);line-height:1.5;color:var(--w8)}
li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--crimson)}
li b{color:var(--w);font-weight:700}
.say{margin:8px 0 6px;background:rgba(61,200,115,.1);border:1px solid rgba(61,200,115,.4);border-radius:13px;padding:15px 17px;display:flex;gap:12px;align-items:flex-start}
.say .ar{color:var(--green);font-weight:800;font-size:20px;line-height:1.3;flex:none}
.say .txt{font-size:clamp(17px,3.3vw,22px);line-height:1.45;font-weight:700;color:var(--green-lt)}
.say.muted{background:rgba(255,255,255,.04);border-color:var(--w1)}
.say.muted .ar{color:var(--rose-lt)}.say.muted .txt{color:var(--w8);font-weight:600}
.spacer{flex:1;min-height:14px}

/* tap zones */
.zone{position:absolute;top:0;bottom:0;width:38%;z-index:3}
.zone.l{left:0}.zone.r{right:0;width:62%}

/* footer nav */
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--w06);border:1px solid var(--w1);color:var(--w);width:52px;height:48px;border-radius:13px;font-size:22px;cursor:pointer;flex:none}
.nav:active{background:var(--w1)}
.nav.disabled{opacity:.3;pointer-events:none}
.next-hint{flex:1;min-width:0;font-size:13px;color:var(--w5);line-height:1.3}
.next-hint .nl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--w4);display:block;margin-bottom:2px}
.next-hint .nt{color:var(--w8);font-weight:700;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* jump overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,8,28,.82);backdrop-filter:blur(8px);display:none;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 0 max(16px,env(safe-area-inset-bottom))}
.ov.on{display:flex}
.ov-h{display:flex;align-items:center;gap:12px;padding:6px 20px 14px;max-width:860px;margin:0 auto;width:100%}
.ov-h h3{font-size:20px;font-weight:800}
.ov-close{margin-left:auto;background:var(--w06);border:1px solid var(--w1);color:var(--w8);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.ov-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:860px;margin:0 auto;width:100%;padding:0 20px}
.ov-grp{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-lt);font-weight:700;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--w1)}
.ov-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer}
.ov-row:active,.ov-row.cur{background:var(--w06)}
.ov-row.cur{border:1px solid rgba(47,116,214,.4)}
.ov-n{font-family:var(--mono);font-size:12px;color:var(--w5);width:30px;flex:none}
.ov-t{font-size:15px;color:var(--w8);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-row.cur .ov-t{color:var(--w)}
.ov-k{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--w4);flex:none}

.hintbar{flex:none;text-align:center;font-size:11px;color:var(--w4);padding-top:8px}
@media (min-width:760px){ .hintbar{padding-top:10px} }
</style>
</head>

const card=document.getElementById('card');
let i=0;
try{const sv=parseInt(localStorage.getItem('kamco_d1_notes'));if(sv>=0&&sv<S.length)i=sv;}catch(e){}
document.getElementById('pt').textContent=S.length;

function esc(s){return s;}
function render(){
  const s=S[i];
  let html='<span class="chip">'+TOPICS[s.t]+'</span>';
  html+='<div class="kind k-'+s.k+'">'+(KIND[s.k]||'')+'</div>';
  html+='<h1>'+s.h+'</h1>';
  if(s.term)html+='<div class="term-badge">'+s.term+'</div>';
  html+='<ul>'+s.b.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if(s.say)html+='<div class="say"><span class="ar">→</span><span class="txt">'+s.say+'</span></div>';
  if(s.sayMuted)html+='<div class="say muted"><span class="ar">·</span><span class="txt">'+s.sayMuted+'</span></div>';
  if(s.note)html+='<div class="say muted"><span class="ar">☕</span><span class="txt">'+s.note+'</span></div>';
  html+='<div class="spacer"></div>';
  card.innerHTML=html;card.scrollTop=0;
  document.getElementById('pn').textContent=i+1;
  document.getElementById('fill').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('prev').classList.toggle('disabled',i===0);
  document.getElementById('next').classList.toggle('disabled',i===S.length-1);
  const nx=document.getElementById('nextT');
  nx.textContent=i<S.length-1?(S[i+1].h):'— end —';
  try{localStorage.setItem('kamco_d1_notes',i);}catch(e){}
}
function go(d){const n=i+d;if(n<0||n>=S.length)return;i=n;render();}

document.getElementById('next').onclick=function(){go(1);};
document.getElementById('prev').onclick=function(){go(-1);};
document.getElementById('zoneR').onclick=function(){go(1);};
document.getElementById('zoneL').onclick=function(){go(-1);};
document.addEventListener('keydown',function(e){
  if(document.getElementById('ov').classList.contains('on')){if(e.key==='Escape')closeOv();return;}
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault();}
  else if(e.key==='Home'){i=0;render();}else if(e.key==='End'){i=S.length-1;render();}
});
// swipe
let sx=0,sy=0;
document.querySelector('.stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.querySelector('.stage').addEventListener('touchend',function(e){
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1);}
},{passive:true});

// jump overlay
const ov=document.getElementById('ov'),ovList=document.getElementById('ovList');
function buildOv(){
  let html='',last='';
  S.forEach(function(s,n){
    if(s.t!==last){html+='<div class="ov-grp">'+TOPICS[s.t]+'</div>';last=s.t;}
    html+='<div class="ov-row'+(n===i?' cur':'')+'" data-n="'+n+'"><span class="ov-n">'+(n+1)+'</span><span class="ov-t">'+s.h+'</span><span class="ov-k">'+(KIND[s.k]||'')+'</span></div>';
  });
  ovList.innerHTML=html;
  [].slice.call(ovList.querySelectorAll('.ov-row')).forEach(function(r){r.onclick=function(){i=+r.dataset.n;render();closeOv();};});
}
function openOv(){buildOv();ov.classList.add('on');const c=ovList.querySelector('.ov-row.cur');if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'center'});}catch(e){}}
function closeOv(){ov.classList.remove('on');}
document.getElementById('jumpBtn').onclick=openOv;
document.getElementById('ovClose').onclick=closeOv;
ov.addEventListener('click',function(e){if(e.target===ov)closeOv();});

render();
</script>
