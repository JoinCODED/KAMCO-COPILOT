<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070509"><title>Day 2 — KIBS Cyber Lab</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{
  --bg:#070509;--bg2:#0C0810;--surface:#140C13;--surface2:#1C1019;--raise:#241622;
  --line:#33212C;--line2:#48303C;--line3:#5E4250;
  --crimson:#D03A52;--crimson-d:#A52439;--rose:#E66B82;--rose-lt:#F4A6B5;--blush:#FBDDE3;
  --blue:#4A87E8;--cyan:#3BD6D6;--green:#3DC873;--green-lt:#8FE6AE;--amber:#EAB94A;--amber-lt:#FFE9B3;--violet:#A07AE6;
  --ink:#FBF7F8;--ink2:#E4DBDF;--dim:#B6A9AE;--faint:#83767E;--ghost:#5B4E56;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Manrope',system-ui,-apple-system,sans-serif;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:22px;
  --sh:0 18px 50px -24px rgba(0,0,0,.7);--sh-acc:0 20px 48px -22px rgba(208,58,82,.5);
  --rail-w:286px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:16px;
  background-image:radial-gradient(70% 55% at 100% 0%,rgba(208,58,82,.10),transparent 62%),radial-gradient(60% 50% at 0% 100%,rgba(74,135,232,.07),transparent 60%);
  background-attachment:fixed}
.mono{font-family:var(--mono)}
button{font-family:inherit}
::selection{background:rgba(208,58,82,.32)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

/* ============ APP SHELL ============ */
#app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}
/* rail */
#rail{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg2),#080509);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.rail-top{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--crimson),var(--crimson-d));display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;box-shadow:0 6px 16px -6px rgba(208,58,82,.7);flex:none}
.brand .bt{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);line-height:1.3}
.brand .bt b{color:var(--rose-lt);display:block;font-size:12.5px;letter-spacing:.1em}
.daychip{margin-top:15px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:99px;padding:6px 12px}
.daychip .d{width:7px;height:7px;border-radius:99px;background:var(--crimson);box-shadow:0 0 8px var(--crimson)}
.daychip.instr .d{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.prog{margin-top:16px}
.prog .pl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:7px}
.prog .pl b{color:var(--ink);font-size:13px}
.prog .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.prog .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--crimson),var(--rose));transition:width .6s cubic-bezier(.2,.8,.2,1)}
/* nav list */
#navList{flex:1;overflow-y:auto;padding:12px 12px 8px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;border:1px solid transparent;background:none;color:inherit;padding:11px 12px;border-radius:var(--r);margin-bottom:4px;transition:all .15s;position:relative}
.nav-i:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
.nav-i.active{background:rgba(208,58,82,.12);border-color:rgba(208,58,82,.4)}
.nav-i .nn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;background:rgba(0,0,0,.25)}
.nav-i.active .nn{color:var(--rose-lt);border-color:rgba(208,58,82,.5)}
.nav-i.solved .nn{color:#06140b;background:var(--green);border-color:var(--green)}
.nav-i .nm{flex:1;min-width:0}
.nav-i .nt{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.nav-i.active .nt{color:var(--ink)}
.nav-i .ns{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:1px;display:flex;gap:7px;align-items:center}
.nav-i .cdot{width:6px;height:6px;border-radius:2px;flex:none}
.nav-i .nstate{flex:none;font-size:12px;color:var(--ghost)}
.nav-i.solved .nstate{color:var(--green)}
.cdot.MAIL,.cdot.FOR,.cdot.CRY{background:var(--rose)} .cdot.SOC,.cdot.IR{background:var(--blue)} .cdot.SE{background:var(--violet)} .cdot.GRC,.cdot.STD,.cdot.POL{background:var(--amber)}
.nav-sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ghost);padding:14px 12px 7px}
.rail-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.rfbtn{flex:1;font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--dim);padding:10px;border-radius:var(--r);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.rfbtn:hover{border-color:var(--rose);color:var(--ink)} .rfbtn b{color:var(--rose-lt)}
.rfbtn.mini{flex:none;width:42px}
/* main */
#main{min-width:0;display:flex;flex-direction:column}
#mtop{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px clamp(18px,3.5vw,40px);background:rgba(8,5,9,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hamb{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--ink);cursor:pointer;font-size:17px;flex:none}
.crumb{font-family:var(--mono);font-size:12.5px;color:var(--faint);min-width:0;display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden}
.crumb .sep{color:var(--ghost)}.crumb .cur{color:var(--ink);text-overflow:ellipsis;overflow:hidden}
.mtop-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--dim);cursor:pointer;font-size:15px;transition:all .15s;display:grid;place-items:center}
.navbtn:hover:not(:disabled){border-color:var(--rose);color:var(--ink)}
.navbtn:disabled{opacity:.3;cursor:not-allowed}
.flagpill{font-family:var(--mono);font-size:12.5px;cursor:pointer;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--dim);padding:9px 13px;border-radius:10px;display:flex;align-items:center;gap:8px;transition:all .15s}
.flagpill:hover{border-color:var(--rose);color:var(--ink)} .flagpill b{color:var(--rose-lt)}
#view{flex:1;overflow-x:hidden}
.wrap{max-width:920px;margin:0 auto;padding:clamp(20px,3.5vw,40px) clamp(18px,3.5vw,40px) 80px;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* instructor banner */
#ibar{grid-column:1 / -1;background:linear-gradient(90deg,rgba(234,185,74,.16),rgba(234,185,74,.04));border-bottom:1px solid rgba(234,185,74,.35);padding:9px clamp(18px,3.5vw,40px);font-family:var(--mono);font-size:12px;color:var(--amber-lt);letter-spacing:.03em;display:flex;align-items:center;gap:9px;z-index:41}
#ibar b{color:var(--amber)}

/* ============ WELCOME ============ */
.hero{padding-top:clamp(10px,4vh,40px)}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);font-weight:700}
.hero h1{margin-top:14px;font-size:clamp(32px,6vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.0}
.hero h1 .g{background:linear-gradient(100deg,var(--rose),var(--crimson) 50%,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin-top:18px;color:var(--dim);font-size:clamp(15px,2.2vw,18px);max-width:60ch}
.howto{margin-top:30px;display:grid;gap:12px;max-width:720px}
.howto .h{display:flex;gap:15px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:linear-gradient(180deg,var(--surface),#100A0E)}
.howto .h .n{font-family:var(--mono);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--crimson),var(--crimson-d));width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.howto .h .ht{font-size:15.5px;color:var(--ink)}.howto .h .ht b{color:var(--rose-lt)}
.hero-cta{margin-top:30px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.chips{margin-top:26px;display:flex;flex-wrap:wrap;gap:9px}
.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);background:rgba(0,0,0,.22);padding:8px 13px;border-radius:99px}
.chip b{color:var(--rose-lt)}

/* ============ BUTTONS ============ */
.btn{font-family:var(--sans);font-weight:800;font-size:15px;cursor:pointer;border:none;border-radius:var(--r);padding:14px 26px;color:#fff;background:linear-gradient(135deg,var(--crimson),var(--crimson-d));transition:all .18s;display:inline-flex;align-items:center;gap:10px}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:var(--sh-acc)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--dim)}
.btn.ghost:hover{border-color:var(--rose);color:var(--ink);box-shadow:none;transform:none;filter:none}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:var(--r-sm)}
.btn.amber{background:linear-gradient(135deg,var(--amber),#cf9a26);color:#1a1206}

/* ============ CTF BRIEF ============ */
.brief{border:1px solid var(--line2);border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(180deg,var(--surface),#110B0F);box-shadow:var(--sh);margin-bottom:24px}
.brief-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:15px 20px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.22)}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);color:var(--dim)}
.badge.cat-MAIL,.badge.cat-FOR,.badge.cat-CRY{color:var(--rose-lt);border-color:rgba(230,107,130,.42)}
.badge.cat-SOC,.badge.cat-IR{color:var(--blue);border-color:rgba(74,135,232,.42)}
.badge.cat-SE{color:var(--violet);border-color:rgba(160,122,230,.42)}
.badge.cat-GRC,.badge.cat-STD,.badge.cat-POL{color:var(--amber);border-color:rgba(234,185,74,.42)}
.brief-top .pts{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber)}
.brief-top .diff{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.brief-top .solved{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--green);display:none;align-items:center;gap:6px}
.brief.done .solved{display:inline-flex}.brief-top .demo{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#1a1206;background:var(--amber);border-radius:99px;padding:4px 12px;font-weight:700}
.brief-body{padding:20px}
.brief-body h2{font-size:clamp(23px,4vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.brief-body h2 .no{font-family:var(--mono);color:var(--crimson);font-size:.55em;font-weight:700;display:block;margin-bottom:6px;letter-spacing:.04em}
.brief-body .scn{margin-top:12px;color:var(--dim);font-size:15.5px;line-height:1.65}.brief-body .scn b{color:var(--rose-lt)}
.brief-body .obj{margin-top:16px;padding:13px 16px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(208,58,82,.05);font-size:14.5px;color:var(--ink2)}.brief-body .obj b{color:var(--rose-lt)}
.brief-body .wild{margin-top:13px;padding:11px 15px;border:1px solid rgba(234,185,74,.28);border-radius:var(--r);background:rgba(234,185,74,.06);font-size:13.5px;color:var(--amber);line-height:1.55}.brief-body .wild b{color:var(--amber-lt)}
.brief-body .fmt{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.brief-body .fmt .pill{border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--dim)}

/* ============ FLAG BANNER ============ */
.flagwrap{margin-top:24px;border:1px solid rgba(61,200,115,.42);border-radius:var(--r-xl);background:linear-gradient(160deg,rgba(61,200,115,.13),rgba(14,8,12,.55));padding:24px 22px;animation:rise .4s}
.flagwrap .ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700;display:flex;align-items:center;gap:8px}
.flagwrap .val{margin-top:13px;font-family:var(--mono);font-size:clamp(16px,3vw,22px);font-weight:700;color:var(--green-lt);background:rgba(0,0,0,.42);border:1px dashed rgba(61,200,115,.5);border-radius:var(--r);padding:15px 17px;word-break:break-all;display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;transition:background .15s}
.flagwrap .val:hover{background:rgba(0,0,0,.6)}.flagwrap .val .cp{font-size:10.5px;letter-spacing:.1em;color:var(--faint);flex:none}
.flagwrap .sub{margin-top:14px;color:var(--dim);font-size:14.5px}.flagwrap .sub b{color:var(--rose-lt)}
.flagwrap .nx{margin-top:18px;display:flex;gap:11px;flex-wrap:wrap}

/* ============ COMPLETION ============ */
.done-hero{text-align:center;padding-top:30px}
.done-hero .ring2{width:96px;height:96px;margin:0 auto 22px;border-radius:99px;background:radial-gradient(circle,rgba(61,200,115,.22),transparent 70%);display:grid;place-items:center;border:2px solid rgba(61,200,115,.5);font-size:42px}
.done-hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
.done-hero h1 .g{background:linear-gradient(100deg,var(--green-lt),var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.done-hero p{margin-top:14px;color:var(--dim);font-size:16px;max-width:54ch;margin-inline:auto}
.flag-summary{margin-top:30px;display:grid;gap:10px;max-width:640px;margin-inline:auto;text-align:left}
.fs-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--surface),#100A0E)}
.fs-row .fi{font-family:var(--mono);font-size:11px;color:#06140b;background:var(--green);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:700}
.fs-row .fn{font-size:13.5px;font-weight:700;color:var(--ink2);flex:none;min-width:120px}
.fs-row .ff{font-family:var(--mono);font-size:12.5px;color:var(--green-lt);word-break:break-all;margin-left:auto;cursor:pointer}
.done-cta{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ============ shared challenge bits ============ */
.st-intro{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--surface),var(--surface2));margin-bottom:16px;font-size:14.5px;color:var(--ink2)}.st-intro b{color:var(--rose-lt)}
.st-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:22px}
.st-hint{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;display:block}
.it-card{margin:11px 0;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--surface),#100A0E);overflow:hidden;transition:border-color .2s}
.it-card.good{border-color:rgba(61,200,115,.5)}.it-card.bad{border-color:rgba(208,58,82,.55)}
.it-body{padding:15px 16px;font-size:14.5px;color:var(--ink2)}
.it-opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 15px}
.opt{font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:rgba(255,255,255,.025);color:var(--ink);transition:all .14s}
.opt:hover{border-color:var(--rose);background:rgba(208,58,82,.08)}.opt.on{border-color:var(--crimson);background:rgba(208,58,82,.18);color:var(--rose-lt)}
.it-fb{display:none;padding:0 16px 14px;font-size:13px;line-height:1.55}.it-fb.show{display:block}.it-fb.g{color:var(--green-lt)}.it-fb.b{color:var(--rose-lt)}

/* ===== inbox (mail) ===== */
.inbox{display:grid;grid-template-columns:288px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-height:440px;background:rgba(0,0,0,.18)}
.mlist{border-right:1px solid var(--line);overflow:auto;max-height:540px}
.mlist .mhd{padding:12px 15px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--line);position:sticky;top:0;background:#100A0E;z-index:1}
.mitem{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:background .12s}
.mitem:hover{background:rgba(208,58,82,.06)}.mitem.sel{background:rgba(208,58,82,.13)}
.mitem .from{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.mitem .dot{width:7px;height:7px;border-radius:99px;background:var(--crimson);flex:none}.mitem.done .dot{background:var(--green)}
.mitem .subj{font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .snip{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpane{padding:20px 22px;overflow:auto;max-height:560px}
.mpane .empty{color:var(--faint);font-family:var(--mono);font-size:13px;text-align:center;margin-top:70px}
.mpane .ph{font-family:var(--mono);font-size:11px;color:var(--faint)}
.mpane .pf{font-size:14px;color:var(--ink);margin:2px 0}.mpane .pf .em{font-family:var(--mono);color:var(--dim)}
.mpane .psub{font-size:17.5px;font-weight:800;margin:13px 0 14px;color:var(--ink)}
.mpane .pbody{font-size:14.5px;color:var(--dim);line-height:1.7}
.mpane .lk{font-family:var(--mono);font-size:13px;color:var(--blue);word-break:break-all;display:inline-block;margin-top:11px;padding:8px 12px;border-radius:8px;background:rgba(74,135,232,.08);border:1px solid rgba(74,135,232,.2)}
.verdict{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}
@media(max-width:680px){.inbox{grid-template-columns:1fr}.inbox.reading .mlist{display:none}.inbox:not(.reading) .mpane{display:none}}
/* headers (BEC) */
.hdr-reveal{display:none;margin:11px 0 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:9px;font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(234,185,74,.06);white-space:pre-wrap;line-height:1.75}.hdr-reveal.show{display:block}
.tl{cursor:pointer;border-bottom:1.5px dotted var(--faint);transition:all .14s;border-radius:3px;padding:1px 3px;color:var(--ink)}
.tl:hover{background:rgba(208,58,82,.12)}.tl.on{background:rgba(234,185,74,.22);border-bottom-color:var(--amber);color:var(--amber-lt)}
.tl.good{background:rgba(61,200,115,.22);border-bottom-color:var(--green);color:var(--green-lt)}.tl.bad{background:rgba(208,58,82,.22)}

/* ===== terminal ===== */
.term{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#05080a;font-family:var(--mono);box-shadow:var(--sh)}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#0b0f12;border-bottom:1px solid var(--line)}
.term-bar .d{width:11px;height:11px;border-radius:99px}.term-bar .r{background:#ec6a5e}.term-bar .y{background:#f4bf4f}.term-bar .g{background:#61c554}
.term-bar .tt{margin-left:8px;font-size:11.5px;color:var(--faint)}
.term-out{padding:15px 17px;font-size:13px;line-height:1.65;color:#cfe3d6;max-height:360px;overflow:auto;white-space:pre-wrap}
.term-out .cmd{color:#fff}.term-out .pr{color:var(--green)}.term-out .c{color:var(--faint)}.term-out .hot{color:var(--amber)}.term-out .b64{color:var(--cyan)}.term-out .fl{color:var(--green-lt);font-weight:700}.term-out .er{color:var(--rose-lt)}.term-out .ok{color:var(--green-lt)}
.term-in-wrap{display:flex;align-items:center;gap:8px;padding:11px 15px;border-top:1px solid var(--line);background:#090d0f}
.term-in-wrap .pr{color:var(--green);font-size:13px;white-space:nowrap}
.term-in{flex:1;background:none;border:none;color:#cfe3d6;font-family:var(--mono);font-size:13px;outline:none}
.cmd-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.cmd-btn{font-family:var(--mono);font-size:12px;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--dim);transition:all .14s}
.cmd-btn:hover{border-color:var(--rose);color:var(--ink)}
.classrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cls{font-family:var(--sans);font-weight:700;font-size:13.5px;cursor:pointer;padding:11px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:rgba(255,255,255,.025);color:var(--ink);transition:all .14s}
.cls:hover{border-color:var(--rose)}.cls.on{border-color:var(--crimson);background:rgba(208,58,82,.18);color:var(--rose-lt)}

/* ===== SIEM ===== */
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;cursor:pointer;padding:12px 17px;color:var(--faint);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--rose-lt);border-bottom-color:var(--crimson)}
.pane{display:none}.pane.on{display:block;animation:fade .25s}
.kl-wrap{display:grid;gap:12px}.kl-note{font-size:13px;color:var(--amber);font-family:var(--mono);display:flex;gap:8px;align-items:center}
.inp{font-family:var(--mono);font-size:13px;background:#05080a;border:1.5px solid var(--line2);border-radius:9px;padding:11px 13px;color:#cfe3d6;outline:none;width:100%}.inp:focus{border-color:var(--rose)}
.kl-cap{font-family:var(--mono);font-size:13px;min-height:62px;background:#05080a;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;color:#cfe3d6;white-space:pre-wrap;word-break:break-all}.kl-cap .cur{color:var(--green)}
.siem{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#080b0e;box-shadow:var(--sh)}
.siem-top{display:flex;align-items:center;gap:10px;padding:12px 15px;background:#0d1115;border-bottom:1px solid var(--line);flex-wrap:wrap}
.siem-top .logo{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.05em}
.siem-top .conn{font-family:var(--mono);font-size:10.5px;color:var(--green);display:flex;align-items:center;gap:6px}
.siem-top .conn::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--green);box-shadow:0 0 8px var(--green)}
.siem-top .rng{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:7px;padding:6px 11px}
.siem-q{display:flex;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.siem-q input{flex:1;background:#05080a;border:1px solid var(--line2);border-radius:8px;padding:11px 13px;color:#cfe3d6;font-family:var(--mono);font-size:12.5px;outline:none}.siem-q input:focus{border-color:var(--blue)}
.siem-meta{display:flex;align-items:center;gap:14px;padding:10px 15px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--faint);flex-wrap:wrap}.siem-meta b{color:var(--ink)}
.sevtag{display:inline-flex;align-items:center;gap:5px}.sd{width:8px;height:8px;border-radius:2px;display:inline-block}.sd.crit{background:#e66b82}.sd.high{background:#e8843a}.sd.med{background:#eab94a}.sd.low{background:#4a87e8}.sd.info{background:#5a6b78}
.ev-table{font-family:var(--mono);font-size:12px;max-height:370px;overflow:auto}
.ev-row{display:grid;grid-template-columns:18px 80px 92px 1fr 26px;gap:10px;padding:10px 15px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;align-items:center;transition:background .12s}
.ev-row.head{position:sticky;top:0;background:#0d1115;color:var(--faint);cursor:default;letter-spacing:.04em;z-index:1}
.ev-row:not(.head):hover{background:rgba(74,135,232,.07)}.ev-row.mark{background:rgba(234,185,74,.1)}
.ev-row .sevcol{display:flex;justify-content:center}
.ev-row .ev{color:#cfe3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev-row .src{color:var(--dim)}.ev-row .pick{text-align:center;color:var(--faint)}.ev-row.mark .pick{color:var(--amber)}
.ev-detail{display:none;padding:14px 17px 16px 43px;border-bottom:1px solid rgba(255,255,255,.04);background:#05080a;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.9}
.ev-detail.show{display:block;animation:fade .2s}.ev-detail .k{color:var(--faint)}.ev-detail .v{color:#cfe3d6}.ev-detail .danger{color:var(--rose-lt)}.ev-detail .b64{color:var(--cyan);word-break:break-all}
.ev-detail .decobtn{margin-top:10px;font-family:var(--mono);font-size:11.5px;cursor:pointer;padding:7px 12px;border-radius:7px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--cyan)}
.ev-detail .decoded{margin-top:9px;color:var(--green-lt);font-weight:700}

/* ===== iceberg / ranking ===== */
.ice-cards{display:grid;gap:10px}
.ice{position:relative;text-align:left;cursor:pointer;border:1.5px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.025);padding:16px 17px;color:inherit;font:inherit;transition:all .15s}
.ice:hover{border-color:var(--rose)}.ice.pick{border-color:var(--crimson);background:rgba(208,58,82,.12)}
.ice .rk{position:absolute;top:14px;right:15px;font-family:var(--mono);font-size:12px;color:var(--rose-lt);font-weight:700}
.ice b{font-weight:700;color:var(--ink)}.ice small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.icefig{margin-top:18px;display:none}.icefig.show{display:block;animation:fade .4s}
.bar3{display:flex;align-items:flex-end;gap:14px;height:160px;padding:10px 4px;border-bottom:1px solid var(--line)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end}
.bcol .fill{width:100%;border-radius:7px 7px 0 0;transition:height .85s cubic-bezier(.2,.8,.2,1)}
.bcol .cap{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}.bcol .pc{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink)}

/* ===== pretext ===== */
.convo{display:grid;gap:12px}
.bub{max-width:92%;padding:13px 16px;border-radius:var(--r-lg);font-size:14.5px;line-height:1.55;background:var(--surface2);border:1px solid var(--line);border-top-left-radius:5px;color:var(--ink2)}
.bub .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.levs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.lev{font-family:var(--mono);font-size:11px;cursor:pointer;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim);transition:all .14s}
.lev:hover{border-color:var(--rose);color:var(--ink)}.lev.on{border-color:var(--amber);background:rgba(234,185,74,.18);color:var(--amber-lt)}
.bub.good{border-color:rgba(61,200,115,.5)}.bub.bad{border-color:rgba(208,58,82,.55)}

/* ===== hashcrack ===== */
.crack-grid{display:grid;gap:14px}
.hash-tbl{border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;font-family:var(--mono);font-size:12.5px}
.hash-tbl .hh{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;padding:11px 15px;background:#0d1115;color:var(--faint);font-size:11px;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
.hrow:last-child{border-bottom:none}.hrow .hu{color:var(--ink2);font-weight:700}.hrow .hx{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hp{text-align:right}.hp .pending{color:var(--ghost)}.hp .cracked{color:var(--rose-lt);font-weight:700}.hp .safe{color:var(--green-lt);font-weight:700}
.crack-console{border:1px solid var(--line2);border-radius:var(--r);background:#05080a;font-family:var(--mono);overflow:hidden}
.cc-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b0f12;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.cc-bar .st{margin-left:auto;color:var(--cyan)}
.cc-out{padding:13px 15px;font-size:12px;line-height:1.7;color:#cfe3d6;max-height:200px;overflow:auto;white-space:pre-wrap}
.cc-out .try{color:var(--faint)}.cc-out .hit{color:var(--rose-lt)}.cc-out .miss{color:var(--amber)}.cc-out .fl{color:var(--green-lt);font-weight:700}

/* ===== IR capstone ===== */
.ir-stage{border:1px solid var(--line2);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,var(--surface),#0f0a0e);box-shadow:var(--sh)}
.ir-phases{display:flex;gap:0;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25);overflow-x:auto}
.ir-ph{flex:1;min-width:96px;text-align:center;padding:12px 8px;font-family:var(--mono);font-size:11px;color:var(--ghost);border-right:1px solid var(--line);position:relative;letter-spacing:.04em}
.ir-ph:last-child{border-right:none}.ir-ph.active{color:var(--rose-lt);background:rgba(208,58,82,.08)}.ir-ph.done{color:var(--green)}
.ir-ph .pn{display:block;font-size:9px;color:var(--ghost);margin-bottom:3px}
.ir-body{padding:20px 22px}
.ir-clock{font-family:var(--mono);font-size:12px;color:var(--rose-lt);letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ir-prompt{font-size:16px;color:var(--ink);line-height:1.6;margin-bottom:18px}.ir-prompt b{color:var(--rose-lt)}
.ir-opts{display:grid;gap:10px}
.ir-opt{text-align:left;cursor:pointer;border:1.5px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.025);color:var(--ink);padding:14px 16px;font:inherit;font-size:14.5px;transition:all .15s;display:flex;gap:12px;align-items:flex-start}
.ir-opt:hover{border-color:var(--rose);background:rgba(208,58,82,.07)}
.ir-opt .ix{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.ir-opt.right{border-color:rgba(61,200,115,.6);background:rgba(61,200,115,.1)}.ir-opt.right .ix{color:#06140b;background:var(--green);border-color:var(--green)}
.ir-opt.wrong{border-color:rgba(208,58,82,.6);background:rgba(208,58,82,.1)}.ir-opt.wrong .ix{color:#fff;background:var(--crimson);border-color:var(--crimson)}
.ir-fb{margin-top:15px;padding:13px 16px;border-radius:var(--r);font-size:14px;line-height:1.55;display:none}.ir-fb.show{display:block;animation:fade .2s}
.ir-fb.g{background:rgba(61,200,115,.1);border:1px solid rgba(61,200,115,.35);color:var(--green-lt)}.ir-fb.b{background:rgba(208,58,82,.1);border:1px solid rgba(208,58,82,.35);color:var(--rose-lt)}
.ir-score{font-family:var(--mono);font-size:12px;color:var(--faint)}.ir-score b{color:var(--amber)}

/* ===== instructor walkthrough stepper ===== */
.walk{margin-top:22px;border:1px solid rgba(234,185,74,.45);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,#161009,#0e0905)}
.walk-hd{display:flex;align-items:center;gap:11px;padding:14px 17px;cursor:pointer;background:rgba(234,185,74,.12);user-select:none}
.walk.open .walk-hd{border-bottom:1px solid rgba(234,185,74,.3)}
.walk-hd .ic{font-size:16px}.walk-hd .tt{font-weight:800;color:var(--amber-lt);font-size:15px}
.walk-hd .pr2{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--amber);background:rgba(0,0,0,.35);border:1px solid rgba(234,185,74,.3);border-radius:99px;padding:3px 11px}
.walk-hd .ch{margin-left:12px;font-family:var(--mono);font-size:12px;color:var(--amber)}
.walk-bd{display:none;padding:19px}.walk.open .walk-bd{display:block;animation:fade .25s}
.walk .say{font-size:14.5px;color:var(--ink);line-height:1.65;border-left:3px solid rgba(234,185,74,.55);padding-left:14px;font-style:italic;margin-bottom:6px}
.walk .stitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:17px 0 10px}
.walk .steps{list-style:none;margin:0;padding:0}
.walk .step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .15s;background:rgba(0,0,0,.22)}
.walk .step:hover{border-color:rgba(234,185,74,.45)}.walk .step.current{border-color:var(--amber);background:rgba(234,185,74,.09);box-shadow:0 0 0 1px rgba(234,185,74,.25)}
.walk .step.done{opacity:.55}.walk .step.done .stxt{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.walk .step .sx{font-family:var(--mono);font-size:12px;font-weight:700;color:#1a1206;background:var(--amber);min-width:23px;height:23px;border-radius:99px;display:grid;place-items:center;flex:none}
.walk .step.done .sx{background:var(--green)}
.walk .step .stxt{font-size:14px;color:var(--ink);line-height:1.55;flex:1}.walk .step .stxt b{color:var(--amber-lt)}
.walk .step .stxt code{font-family:var(--mono);font-size:12.5px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--cyan)}
.walk .step .tick{font-family:var(--mono);font-size:14px;color:var(--faint);flex:none}.walk .step.done .tick{color:var(--green)}
.walk .ctrls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.walk .wbtn{font-family:var(--mono);font-size:12px;cursor:pointer;padding:8px 13px;border-radius:8px;border:1px solid rgba(234,185,74,.4);background:rgba(234,185,74,.08);color:var(--amber-lt);transition:all .14s}.walk .wbtn:hover{background:rgba(234,185,74,.16)}
.walk .point{margin-top:15px;font-size:14.5px;color:var(--rose-lt);line-height:1.6;background:rgba(208,58,82,.07);border:1px solid rgba(208,58,82,.2);border-radius:var(--r);padding:13px 15px}.walk .point b{color:var(--blush)}
.walk .flagline{margin-top:12px;font-family:var(--mono);font-size:14px;color:var(--green-lt);background:rgba(0,0,0,.4);border:1px dashed rgba(61,200,115,.4);border-radius:9px;padding:12px 15px;word-break:break-all}

/* ===== tray + toast ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.on{opacity:1;pointer-events:auto}
#tray{position:fixed;top:0;right:0;height:100%;width:min(380px,88vw);z-index:60;background:linear-gradient(180deg,var(--surface),#0a060a);border-left:1px solid var(--line2);box-shadow:-30px 0 60px -20px rgba(0,0,0,.7);transform:translateX(100%);transition:transform .3s;padding:24px;overflow:auto}
#tray.open{transform:none}
#tray h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:4px}
#tray .sub{font-size:12.5px;color:var(--faint);margin-bottom:18px}
#tray .close{position:absolute;top:17px;right:17px;background:none;border:none;color:var(--faint);font-size:20px;cursor:pointer}
.tflag{margin:10px 0;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(0,0,0,.3)}.tflag.empty{border-style:dashed;color:var(--faint);font-size:13px}
.tflag .tn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}.tflag .tv{font-family:var(--mono);font-size:13px;color:var(--green-lt);word-break:break-all;margin-top:4px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-170%);z-index:80;background:linear-gradient(160deg,rgba(61,200,115,.96),rgba(22,128,75,.96));color:#06140b;font-weight:800;padding:15px 24px;border-radius:var(--r);box-shadow:0 18px 40px -14px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:2px;transition:transform .4s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .tt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}#toast .tf{font-family:var(--mono);font-size:14px;word-break:break-all}

/* ============ RESPONSIVE ============ */
@media(max-width:880px){
  :root{--rail-w:0px}
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;width:300px;transform:translateX(-100%);transition:transform .3s}
  #rail.open{transform:none;box-shadow:30px 0 60px -20px rgba(0,0,0,.7)}
  .hamb{display:grid;place-items:center}
  #ibar{position:relative}
}
@media(max-width:520px){
  .mtop-r .navbtn{display:none}
  .wrap{padding-left:16px;padding-right:16px}
}

/* ===== KIBS co-brand ===== */
.brand{flex-wrap:wrap}
.brand .bx{color:var(--ghost);font-size:13px;font-weight:600;margin:0 -2px}
.brand .klogo{height:32px;width:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.cobrand{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.cobrand .kbig{height:62px;width:auto;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.cobrand .cb-txt b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.cobrand .cb-txt span{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.02em}
@media(max-width:520px){.cobrand .kbig{height:50px}.cobrand .cb-txt b{font-size:14px}}

/* ===== flag submission ===== */
.subbox{margin-top:18px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line2);border-radius:var(--r-lg);padding:18px 18px 16px;position:relative;overflow:hidden}
.subbox.armed{border-color:rgba(208,58,82,.5);box-shadow:0 0 0 1px rgba(208,58,82,.16),0 18px 40px -26px rgba(208,58,82,.5)}
.subbox.err{border-color:var(--crimson)}
.sb-reveal{display:none}
.sb-reveal.on{display:block;margin-bottom:16px;padding:14px;background:rgba(61,200,115,.07);border:1px solid rgba(61,200,115,.35);border-radius:var(--r);animation:rvin .35s ease}
@keyframes rvin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rv-tag{font:800 11px/1 var(--sans);letter-spacing:.05em;color:var(--green-lt);text-transform:uppercase;margin-bottom:9px}
.rv-val{display:inline-flex;align-items:center;gap:12px;cursor:pointer;background:var(--bg);border:1px dashed var(--line3);border-radius:8px;padding:9px 13px;font:600 15px/1 var(--mono)}
.rv-val .rv{color:var(--rose-lt)}
.rv-cp{font:800 10px/1 var(--sans);letter-spacing:.1em;color:var(--faint);border-left:1px solid var(--line2);padding-left:11px}
.rv-hint{margin-top:9px;font:500 12.5px/1.5 var(--sans);color:var(--dim)}
.sb-hd{display:flex;align-items:center;gap:9px;font:800 15px/1.2 var(--sans);color:var(--ink);letter-spacing:-.01em}
.sb-ic{color:var(--crimson)}
.sb-help{margin:7px 0 14px;font:500 13px/1.6 var(--sans);color:var(--dim);max-width:62ch}
.sb-row{display:flex;gap:10px;align-items:stretch}
.sb-in{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line2);border-radius:10px;padding:13px 15px;font:600 15px/1 var(--mono);color:var(--blush);letter-spacing:.02em;transition:border-color .15s,box-shadow .15s}
.sb-in::placeholder{color:var(--ghost)}
.sb-in:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 3px rgba(208,58,82,.18)}
.subbox.err .sb-in{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(208,58,82,.16)}
.sb-btn{flex:none;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,var(--crimson),var(--crimson-d));color:#fff;border:none;border-radius:10px;padding:0 22px;font:800 14px/1 var(--sans);cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 12px 26px -14px rgba(208,58,82,.8)}
.sb-btn span{transition:transform .15s}
.sb-btn:hover{filter:brightness(1.07)}.sb-btn:hover span{transform:translateX(3px)}
.sb-btn:active{transform:translateY(1px)}
.sb-msg{min-height:18px;margin-top:10px;font:700 12.5px/1.4 var(--sans)}
.sb-msg.err{color:var(--rose-lt)}
.sb-msg .x{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--crimson);color:#fff;font-size:10px;margin-right:5px;vertical-align:-2px}
@keyframes sbshake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.subbox.shake{animation:sbshake .5s cubic-bezier(.36,.07,.19,.97)}
@media(max-width:560px){.sb-row{flex-direction:column}.sb-btn{padding:13px;justify-content:center}}

/* back-to-workshop button */
.backbtn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-family:var(--sans);font-weight:700;font-size:13px;color:var(--dim);background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:8px 13px;margin-right:8px;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap;flex:none}
.backbtn:hover{color:var(--ink);border-color:var(--line3);background:var(--raise)}
.backbtn:active{transform:translateY(1px)}

bj":"Map each control to the framework that requires it — and spot the controls that satisfy <b>all three</b> at once.","wild":"Capital One’s 2019 breach (100M+ records) failed a control that ISO 27001, NIST CSF and PCI-DSS all demand — one gap, three frameworks.","engine":"assign","data":{"resetId":"d2-std1","opts":[{"k":"iso","label":"ISO 27001"},{"k":"nist","label":"NIST CSF"},{"k":"pci","label":"PCI-DSS"},{"k":"all","label":"All three"}],"intro":"Match each control to the framework that requires it. Two of them satisfy all three at once.","items":[{"html":"Encrypt cardholder data at rest and in transit.","key":"pci","why":"Protecting card data is the core of PCI-DSS."},{"html":"Maintain a certified, audited Information Security Management System (ISMS).","key":"iso","why":"The ISMS is the heart of ISO 27001."},{"html":"Organise security around Identify · Protect · Detect · Respond · Recover.","key":"nist","why":"Those five functions define the NIST CSF."},{"html":"Enforce multi-factor authentication on all administrative access.","key":"all","why":"MFA on admin is demanded by ISO, NIST and PCI alike — one control, three frameworks."},{"html":"Keep and actively monitor access logs for critical systems.","key":"all","why":"Logging and monitoring appears across all three frameworks."}]}},{"id":"d2-pol1","no":2,"cat":"POL","pts":200,"diff":"HARD","title":"Mind the Gap","scn":"A bank has policies and standards on paper — but one thing that should exist simply doesn’t. That gap is where the breach gets in.","obj":"Classify each document as Policy, Standard or Procedure — and mark the one item that is a <b>missing-procedure gap</b>.","wild":"Morgan Stanley was fined ~$60M (2020) because decommissioned servers were never wiped — the policy existed; the procedure was never followed.","engine":"assign","data":{"resetId":"d2-pol1","opts":[{"k":"pol","label":"Policy"},{"k":"std","label":"Standard"},{"k":"proc","label":"Procedure"},{"k":"gap","label":"Gap — missing"}],"intro /* ============ generic pick-per-item (assign / classify / map) ============ */
function buildAssign(root,done,data){
  root.innerHTML='<div class="st-intro">'+data.intro+'</div><div class="items"></div>'+
   '<div class="st-actions"><button class="btn check">Check answers →</button><button class="btn ghost reset">Reset</button><span class="st-hint"></span></div>';
  var box=root.querySelector('.items'),sel={};
  data.items.forEach(function(it,i){var c=document.createElement('div');c.className='it-card';
    c.innerHTML='<div class="it-body">'+it.html+'</div><div class="it-opts">'+data.opts.map(function(o){return '<button class="opt" data-k="'+o.k+'">'+o.label+'</button>';}).join('')+'</div><div class="it-fb"></div>';
    box.appendChild(c);c.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){sel[i]=b.dataset.k;c.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('on',x===b);});};});});
  root.querySelector('.check').onclick=function(){var ok=0,ans=0;data.items.forEach(function(it,i){var c=box.children[i],fb=c.querySelector('.it-fb');if(sel[i]==null)return;ans++;
    var g=sel[i]===it.key;if(g)ok++;c.classList.toggle('good',g);c.classList.toggle('bad',!g);fb.className='it-fb show '+(g?'g':'b');fb.innerHTML=(g?'✓ ':'✗ ')+it.why;});
    var h=root.querySelector('.st-hint');if(ans<data.items.length){h.textContent='Answer all '+data.items.length+' first.';return;}
    if(ok===data.items.length){h.textContent='';done();}else h.textContent=ok+'/'+data.items.length+' correct — fix the red ones.';};
  root.querySelector('.reset').onclick=function(){reopenChallenge(data.resetId);};
}

function buildIceberg(root,done,data){

  function paint(){box.querySelectorAll('.ice').forEach(function(el){var i=order.indexOf(el.dataset.id);el.classList.toggle('pick',i>=0);el.querySelector('.rk').textContent=i>=0?'#'+(i+1):'';});}
  cards.forEach(function(c){var el=document.createElement('button');el.className='ice';el.dataset.id=c.id;el.innerHTML='<span class="rk"></span><b>'+c.b+'</b><small>'+c.s+'</small>';
    el.onclick=function(){var i=order.indexOf(c.id);if(i>=0)order.splice(i,1);else if(order.length<cards.length)order.push(c.id);paint();};box.appendChild(el);});
  root.querySelector('.check').onclick=function(){var h=root.querySelector('.st-hint');if(order.length<cards.length){h.textContent='Tap all in order first.';return;}

      setTimeout(done,500);}else h.textContent='Not the real order. The part you can see is the smallest. Reset and rethink.';};
  root.querySelector('.reset').onclick=function(){reopenChallenge(data.resetId);};
}

/* ============ hashcrack (real MD5 dictionary attack) ============ */
function buildHashcrack(root,done,data){
  var rows=data.rows.map(function(r){return {user:r.user,hash:r.hash,algo:r.algo,plain:null,cracked:false};});
  root.innerHTML='<div class="st-intro">'+data.intro+'</div><div class="crack-grid">'+
    '<div class="hash-tbl" id="ht"><div class="hh"><span>user</span><span>'+rows[0].algo+' hash (unsalted)</span><span>password</span></div></div>'+
    '<div class="crack-console"><div class="cc-bar"><span>⚙ dictionary attack · wordlist: '+data.wordlist.length+' entries</span><span class="st" id="ccst">idle</span></div><div class="cc-out" id="cco"><span class="try">Ready. Click “Run attack” to hash every wordlist entry and compare.</span></div></div></div>'+
    '<div class="st-actions"><button class="btn" id="runb">▶ Run dictionary attack</button><button class="btn ghost reset">Reset</button><span class="st-hint" id="hch"></span></div>';
  var ht=root.querySelector('#ht');
  function drawRows(){ht.querySelectorAll('.hrow').forEach(function(n){n.remove();});rows.forEach(function(r){var d=document.createElement('div');d.className='hrow';
    var pc=r.cracked?'<span class="cracked">'+r.plain+'</span>':(r.tried?'<span class="safe">not in wordlist</span>':'<span class="pending">— pending —</span>');
    d.innerHTML='<span class="hu">'+r.user+'</span><span class="hx">'+r.hash+'</span><span class="hp">'+pc+'</span>';ht.appendChild(d);});}
  drawRows();
  var out=root.querySelector('#cco');
  root.querySelector('#runb').onclick=function(){
    root.querySelector('#ccst').textContent='running…';out.innerHTML='';
    var log=[];
    data.wordlist.forEach(function(w){var hsh=md5(w);var hit=null;rows.forEach(function(r){if(!r.cracked&&r.hash.toLowerCase()===hsh){r.cracked=true;r.plain=w;hit=r;}});
      if(hit)log.push('<span class="hit">[+] CRACKED  '+hit.user+'  →  '+w+'</span>');
      else log.push('<span class="try">    tried  '+w+'  ('+hsh.slice(0,12)+'…)</span>');});
    rows.forEach(function(r){if(!r.cracked)r.tried=true;});
    var nCracked=rows.filter(function(r){return r.cracked;}).length,nSafe=rows.length-nCracked;
    log.push('');log.push('<span class="miss">[*] wordlist exhausted · '+nCracked+' cracked, '+nSafe+' survived</span>');
    rows.filter(function(r){return !r.cracked;}).forEach(function(r){log.push('<span class="miss">[-] '+r.user+': no match — '+(r.note||'long passphrase, not guessable from a wordlist')+'</span>');});
    out.innerHTML=log.join('\n');out.scrollTop=out.scrollHeight;drawRows();
    root.querySelector('#ccst').textContent='done';
    if(nCracked===data.expectCracked&&nSafe>=1){out.innerHTML+='\n\n<span class="fl">[✓] '+data.flag+'</span>';root.querySelector('#hch').textContent='';done();}
    else root.querySelector('#hch').textContent='Attack ran — review which fell and which held.';
  };
  root.querySelector('.reset').onclick=function(){reopenChallenge(data.resetId);};
}

    '<div class="chips"><span class="chip"><b>'+CHALLENGES.length+'</b> challenges</span><span class="chip"><b>'+totPts+'</b> points</span><span class="chip"><b>'+cats.length+'</b> categories</span><span class="chip">flag · <b>KIBS{ }</b></span></div>'+
    '<div class="howto">'+
      '<div class="h"><span class="n">1</span><span class="ht">Pick a challenge from the left. Each one has a short <b>brief</b> — the scenario, your objective, and a real-world case it’s based on.</span></div>'+
      '<div class="h"><span class="n">2</span><span class="ht">Work the <b>live environment</b> — read the inbox, run the terminal, hunt the logs, judge the call. '+(MODE==='instructor'?'The on-screen walkthrough lists every step so the room follows along.':'Everything is safe, in-browser, and benign.')+'</span></div>'+
      '<div class="h"><span class="n">3</span><span class="ht">Uncover the <b>KIBS{…} flag</b>, then <b>submit it</b> to capture it. Your progress saves automatically on this device.</span></div>'+
    '</div><div class="hero-cta"><button class="btn" id="startB">'+(solvedCount()?'Continue →':'Start the lab →')+'</button>'+(allSolved()?'<button class="btn ghost" id="resB">See results</button>':'')+'</div></div></div>';
  document.getElementById('startB').onclick=function(){var first=CHALLENGES.filter(function(c){return !captured[c.id];})[0]||CHALLENGES[0];openChallenge(first.id);};
  if(allSolved())document.getElementById('resB').onclick=showCompletion;
  closeRail();}

function openChallenge(id){var c=byId(id);if(!c)return;setActive(id);closeRail();
  var done=captured[id];
  var v=document.getElementById('view');
  v.innerHTML='<div class="wrap"><div class="brief'+(done?' done':'')+'"><div class="brief-top">'+
    '<span class="badge cat-'+c.cat+'">'+c.cat+'</span><span class="pts">'+c.pts+' pts</span><span class="diff">'+c.diff+'</span>'+
    (MODE==='instructor'?'<span class="demo">INSTRUCTOR DEMO</span>':'<span class="solved">✓ solved</span>')+
    '</div><div class="brief-body"><h2><span class="no">'+c.cat+'-0'+c.no+' · challenge '+(idx(id)+1)+'</span>'+c.title+'</h2>'+
    '<div class="scn">'+c.scn+'</div><div class="obj"><b>Objective —</b> '+c.obj+'</div>'+
    '<div class="wild"><b>⚑ Seen in the wild —</b> '+c.wild+'</div>'+
    '<div class="fmt">Flag format <span class="pill">KIBS{ ___ }</span><span>·</span>find it, then submit below</div>'+
    '</div></div><div class="env" id="env"></div></div>';
  var env=document.getElementById('env');
  try{ENGINES[c.engine](env,function(){revealFlag(id);},c.data);}catch(e){env.innerHTML='<div class="st-intro" style="border-color:var(--crimson)">Engine error: '+e.message+'</div>';}
  var wrap=v.querySelector('.wrap');
  if(MODE==='instructor'&&c.walk)renderWalk(wrap,c);
  if(done){flagBanner(wrap,id);}else{renderSubmit(wrap,id);}
  window.scrollTo(0,0);}
var reopenChallenge=openChallenge;

function renderSubmit(wrap,id){if(captured[id])return;
  var s=document.createElement('div');s.className='subbox';s.id='subbox';
  s.innerHTML='<div class="sb-reveal" id="sbReveal"></div>'+
    '<div class="sb-hd"><span class="sb-ic">⚑</span>Submit the flag to capture it</div>'+
    '<div class="sb-help">Work the challenge above to uncover the <b>KIBS{…}</b> flag, then enter it here — it saves automatically the moment it’s correct.</div>'+
    '<div class="sb-row"><input id="flagInput" class="sb-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="KIBS{ … }"><button class="sb-btn" id="flagSubmit">Submit <span>→</span></button></div>'+
    '<div class="sb-msg" id="sbMsg"></div>';
  wrap.appendChild(s);
  var inp=s.querySelector('#flagInput');
  s.querySelector('#flagSubmit').onclick=function(){submitFlag(id);};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitFlag(id);}});
  inp.addEventListener('input',function(){s.classList.remove('err');var m=document.getElementById('sbMsg');if(m){m.textContent='';m.className='sb-msg';}});}

function revealFlag(id){if(captured[id])return;
  var rev=document.getElementById('sbReveal');if(!rev||rev.dataset.shown)return;rev.dataset.shown='1';
  var flag=FLAGS[id];
  rev.innerHTML='<div class="rv-tag">🚩 You uncovered the flag</div>'+
    '<div class="rv-val" title="click to copy"><span class="rv">'+flag+'</span><span class="rv-cp">COPY</span></div>'+
    '<div class="rv-hint">Drop it in the box below and hit Submit to capture it.</div>';
  rev.classList.add('on');var box=document.getElementById('subbox');if(box)box.classList.add('armed');
  rev.querySelector('.rv-val').onclick=function(){copyText(flag);var cp=rev.querySelector('.rv-cp');cp.textContent='COPIED ✓';setTimeout(function(){cp.textContent='COPY';},1300);};
  var inp=document.getElementById('flagInput');if(inp){try{inp.focus();}catch(e){}}}

function submitFlag(id,override){if(captured[id])return;
  var inp=document.getElementById('flagInput');
  var val=(override!=null?override:(inp?inp.value:'')).trim();
  if(!val){flagError('Enter the flag, then hit Submit.');return;}
  if(val===FLAGS[id]){capture(id);}
  else{flagError('Not the right flag — work the challenge above to uncover it.');}}

function flagError(msg){var box=document.getElementById('subbox'),m=document.getElementById('sbMsg');
  if(m){m.innerHTML='<span class="x">✕</span> '+msg;m.className='sb-msg err';}
  if(box){box.classList.add('err');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}}

function capture(id){if(captured[id])return;captured[id]=FLAGS[id];persist();renderNav();updateProgress();
  var br=document.querySelector('#view .brief');if(br)br.classList.add('done');
  var box=document.getElementById('subbox');if(box&&box.parentNode)box.parentNode.removeChild(box);
  if(active===id){var wrap=document.querySelector('#view .wrap');if(wrap&&!wrap.querySelector('.flagwrap'))flagBanner(wrap,id);}
  showToast(FLAGS[id]);}

function flagBanner(wrap,id){var c=byId(id),flag=FLAGS[id];
  var next=null,i=idx(id);for(var j=i+1;j<CHALLENGES.length;j++){if(!captured[CHALLENGES[j].id]){next=CHALLENGES[j];break;}}
  if(!next)next=CHALLENGES.filter(function(x){return !captured[x.id];})[0]||null;
  var b=document.createElement('div');b.className='flagwrap';
  b.innerHTML='<div class="ttl">⚑ Flag captured — '+c.cat+'-0'+c.no+'</div>'+
    '<div class="val" title="click to copy"><span>'+flag+'</span><span class="cp">CLICK TO COPY</span></div>'+
    '<div class="sub">Flag captured'+(MODE==='instructor'?' — in the demo, point out the lesson before you reveal it.':' — challenge cleared.')+'</div>'+
    '<div class="nx">'+(next?'<button class="btn sm" data-go="'+next.id+'">Next: '+next.title+' →</button>':'<button class="btn sm amber" id="goRes">🎉 See your results →</button>')+'<button class="btn ghost sm" id="goOv">Overview</button></div>';
  wrap.appendChild(b);
  b.querySelector('.val').onclick=function(){copyText(flag);var cp=b.querySelector('.cp');cp.textContent='COPIED ✓';setTimeout(function(){cp.textContent='CLICK TO COPY';},1300);};
  var go=b.querySelector('[data-go]');if(go)go.onclick=function(){openChallenge(go.dataset.go);};
  var gr=b.querySelector('#goRes');if(gr)gr.onclick=showCompletion;
  b.querySelector('#goOv').onclick=showWelcome;}

function showCompletion(){setActive(null);document.getElementById('crumb').textContent='Results';closeRail();
  var v=document.getElementById('view'),totPts=CHALLENGES.reduce(function(a,c){return a+c.pts;},0);
  v.innerHTML='<div class="wrap"><div class="done-hero"><div class="ring2">🏁</div><h1>Lab <span class="g">complete</span></h1>'+
    '<p>All '+CHALLENGES.length+' flags captured — '+totPts+' points. '+(MODE==='instructor'?'You’ve demoed every station; hand the trainees their lab and let them earn these themselves.':'Every challenge cleared — nicely done.')+'</p></div>'+
    '<span class="lbl" style="text-align:center;display:block">Your captured flags</span><div class="flag-summary" id="fsum"></div>'+
    '<div class="done-cta"><button class="btn" id="revB">Review challenges</button><button class="btn ghost" id="resAll">↺ Reset all</button></div></div>';
  var fs=document.getElementById('fsum');CHALLENGES.forEach(function(c){var r=document.createElement('div');r.className='fs-row';
    r.innerHTML='<span class="fi">'+c.cat.slice(0,1)+'</span><span class="fn">'+c.cat+'-0'+c.no+'</span><span class="ff" title="copy">'+(captured[c.id]||'—')+'</span>';
    fs.appendChild(r);var ff=r.querySelector('.ff');ff.onclick=function(){copyText(captured[c.id]||'');ff.textContent='copied ✓';setTimeout(function(){ff.textContent=captured[c.id];},1100);};});
  document.getElementById('revB').onclick=function(){openChallenge(CHALLENGES[0].id);};
  document.getElementById('resAll').onclick=resetAll;}

/* ---- tray / toast / rail ---- */
function renderTray(){var t=document.getElementById('trayList');var got=CHALLENGES.filter(function(c){return captured[c.id];});
  if(!got.length){t.innerHTML='<div class="tflag empty">No flags yet — solve a challenge to capture one.</div>';return;}
  t.innerHTML=got.map(function(c){return '<div class="tflag"><div class="tn">'+c.cat+'-0'+c.no+' · '+c.title+'</div><div class="tv">'+captured[c.id]+'</div></div>';}).join('');}
function openTray(){renderTray();document.getElementById('tray').classList.add('open');document.getElementById('scrim').classList.add('on');}
function closeTray(){document.getElementById('tray').classList.remove('open');document.getElementById('scrim').classList.remove('on');}
function showToast(flag){var t=document.getElementById('toast');document.getElementById('toastF').textContent=flag;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.classList.remove('show');},3200);}
function toggleRail(){var r=document.getElementById('rail');r.classList.toggle('open');document.getElementById('scrim').classList.toggle('on',r.classList.contains('open'));}
function closeRail(){var r=document.getElementById('rail');if(r)r.classList.remove('open');if(!document.getElementById('tray').classList.contains('open'))document.getElementById('scrim').classList.remove('on');}

function navMove(dir){if(active===null){if(dir>0)openChallenge(CHALLENGES[0].id);return;}var i=idx(active)+dir;if(i<0){showWelcome();return;}if(i>=CHALLENGES.length){if(allSolved())showCompletion();return;}openChallenge(CHALLENGES[i].id);}

function resetAll(){captured={};persist();renderNav();updateProgress();closeTray();showWelcome();}

function copyText(t){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;}}catch(e){}try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}

/* ---- instructor walkthrough stepper ---- */
function renderWalk(wrap,c){var w=document.createElement('div');w.className='walk open';var steps=c.walk.do;
  w.innerHTML='<div class="walk-hd"><span class="ic">🎬</span><span class="tt">Live solution walkthrough</span><span class="pr2"><span class="pdone">0</span> / '+steps.length+' steps</span><span class="ch">▾ hide</span></div>'+
    '<div class="walk-bd"><div class="say">'+c.walk.say+'</div><div class="stitle">Solution steps — tick each off as you demo it on screen</div>'+
    '<ol class="steps">'+steps.map(function(s,i){return '<li class="step" data-i="'+i+'"><span class="sx">'+(i+1)+'</span><span class="stxt">'+s+'</span><span class="tick">○</span></li>';}).join('')+'</ol>'+
    '<div class="ctrls"><button class="wbtn next">▶ Mark next step done</button><button class="wbtn reset">↺ Reset steps</button></div>'+
    '<div class="point"><b>Why it matters —</b> '+c.walk.point+'</div><div class="flagline">⚑ Flag to land on: '+FLAGS[c.id]+'</div></div>';
  w.querySelector('.walk-hd').onclick=function(){var o=w.classList.toggle('open');w.querySelector('.ch').textContent=o?'▾ hide':'▸ show';};
  var els=[].slice.call(w.querySelectorAll('.step'));
  function refresh(){var dn=0;els.forEach(function(el){var d=el.classList.contains('done');if(d)dn++;el.classList.remove('current');el.querySelector('.tick').textContent=d?'✓':'○';});var cur=els.filter(function(el){return !el.classList.contains('done');})[0];if(cur)cur.classList.add('current');w.querySelector('.pdone').textContent=dn;}
  els.forEach(function(el){el.onclick=function(){el.classList.toggle('done');refresh();};});
  w.querySelector('.next').onclick=function(e){e.stopPropagation();var cur=els.filter(function(el){return !el.classList.contains('done');})[0];if(cur){cur.classList.add('done');refresh();}};
  w.querySelector('.reset').onclick=function(e){e.stopPropagation();els.forEach(function(el){el.classList.remove('done');});refresh();};
  refresh();wrap.appendChild(w);}

initShell();
</script></body></html>
